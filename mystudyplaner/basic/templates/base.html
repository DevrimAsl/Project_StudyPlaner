<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>StudyPlanner</title>
</head>
<body>

    <h1>📚 StudyPlanner</h1>

    <nav>
        <a href="/">Home</a>

        {% if user.is_authenticated %}
            <span>Hallo, {{ user.username }}</span>
            <a href="/logout/">Logout</a>
        {% else %}
            <a href="/login/">Login</a>
        {% endif %}
    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
